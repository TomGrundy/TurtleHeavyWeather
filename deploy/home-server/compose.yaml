services:
  turtleheavyweather:
    build:
      context: ../..
      dockerfile: deploy/home-server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - thw_data:/var/lib/turtleheavyweather
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - turtleheavyweather

volumes:
  thw_data:
  caddy_data:
  caddy_config:
